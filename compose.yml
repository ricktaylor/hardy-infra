# Hardy BPA Server — S3/PostgreSQL storage
#
# Usage:
#   docker compose up                     # BPA + embedded TCPCL
#   docker compose --profile tcpcl up     # adds standalone TCPCL

services:
  hardy:
    image: ghcr.io/ricktaylor/hardy/hardy-bpa-server:latest
    restart: unless-stopped
    ports:
      - "50051:50051"
      - "4556:4556"
    environment:
      HARDY_BPA_SERVER_CONFIG_FILE: /etc/hardy/hardy.toml
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./configs/hardy.toml:/etc/hardy/hardy.toml:ro
      - bundles:/var/lib/hardy/bundles
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=127.0.0.1:50051"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  hardy-tcpcl:
    image: ghcr.io/ricktaylor/hardy/hardy-tcpclv4-server:latest
    profiles: [tcpcl]
    restart: unless-stopped
    ports:
      - "4557:4556"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ./configs/hardy-tcpcl.toml:/etc/hardy/tcpcl.toml:ro
    command: ["--config", "/etc/hardy/tcpcl.toml"]
    depends_on:
      hardy:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hardy
      POSTGRES_PASSWORD: hardy
      POSTGRES_DB: hardy
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hardy"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/hardy-bundles
      "

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    volumes:
      - ./otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  bundles:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
